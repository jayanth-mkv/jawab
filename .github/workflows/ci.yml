name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -q
        env: { STORE: memory, GOOGLE_CLOUD_PROJECT: ci }
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false && terraform -chdir=infra validate
  # Every push to main that passes the checks above ships to Cloud Run (keyless: GitHub OIDC -> Workload Identity).
  deploy:
    needs: [test, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    concurrency: { group: deploy, cancel-in-progress: false }
    env:
      PROJECT: jawab-b2036-ad05
      REGION: us-central1
      IMAGE: us-central1-docker.pkg.dev/jawab-b2036-ad05/jawab/jawab:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/409832267025/locations/global/workloadIdentityPools/github/providers/github
          service_account: jawab-deployer@jawab-b2036-ad05.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -t "$IMAGE" . && docker push "$IMAGE"
      - run: gcloud run services update jawab --image "$IMAGE" --region "$REGION" --project "$PROJECT" --quiet
      - run: |
          url="$(gcloud run services describe jawab --region "$REGION" --project "$PROJECT" --format 'value(status.url)')"
          curl -fsS "$url/health" && echo "Deployed $IMAGE -> $url"
